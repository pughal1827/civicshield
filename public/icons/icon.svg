<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="8"/>

  <!-- Shield Emblem -->
  <path d="M256 72 C336 72, 400 104, 400 104 V232 C400 336, 320 408, 256 440 C192 408, 112 336, 112 232 V104 C112 104, 176 72, 256 72 Z"
        fill="url(#shieldGrad)"
        filter="url(#glow)" />

  <!-- Inner Shield Detail -->
  <path d="M256 112 C316 112, 360 136, 360 136 V232 C360 312, 304 368, 256 394 C208 368, 152 312, 152 232 V136 C152 136, 196 112, 256 112 Z"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.3"
        stroke-width="8" />

  <!-- Center Checkmark Icon -->
  <path d="M208 248 L240 280 L304 208"
        fill="none"
        stroke="#ffffff"
        stroke-width="28"
        stroke-linecap="round"
        stroke-linejoin="round" />
</svg>
